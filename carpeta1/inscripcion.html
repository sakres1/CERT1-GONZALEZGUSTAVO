<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscripción - Puerto Abierto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <nav class="navbar navbar-expand-md sticky-top py-3">
      <div class="container">
        <a class="navbar-brand fw-bold fs-11" href="index.html">Centro Cultural</a>
        <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
          <ul class="navbar-nav gap-3">
            <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="cartelera.html">Cartelera</a></li>
            <li class="nav-item"><a class="nav-link" href="inscripcion.html">Inscripción</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm p-4" style="background-color: rgb(224, 11, 11);">
         
          <h1 class="text-center h2 mb-4">Formulario de Inscripción</h1>
          <p class="text-muted text-center mb-4">Completa tus datos para asegurar tu cupo en nuestras actividades.</p>
         
          <!-- FORMULARIO -->
          <form action="#" method="POST">
           
            <!-- Nombre Completo -->
            <div class="mb-3">
              <label for="nombre" class="form-label fw-bold">Nombre completo *</label>
              <input type="text" class="form-control" id="nombre" name="nombre" required placeholder="Gustavo Gonzalez">
            </div>

            <!-- Correo y Teléfono  -->
            <div class="row mb-3">
              <div class="col-md-6">
                <label for="correo" class="form-label fw-bold">Correo electrónico *</label>
                <input type="email" class="form-control" id="correo" name="correo" required placeholder="correo@correo.com">
              </div>
              <div class="col-md-6 mt-3 mt-md-0">
                <label for="telefono" class="form-label fw-bold">Teleono *</label>
                <input type="tel" class="form-control" id="telefono" name="telefono" required placeholder="+569 12345678">
              </div>
              <div class="col-md-6 mt-3 mt-md-0">
                <label for="nacimiento" class="form-label fw-bold">Fechadenacimiento *</label>
                <input type="tel" class="form-control" id="fecha" name="fecha" required placeholder="DD/MM/YYYY">
              </div>
            </div>

            <!-- Edad y Actividad -->
            <div class="row mb-3">
              <div class="col-md-4">
                <label for="edad" class="form-label fw-bold">Edad *</label>
                <input type="number" class="form-control" id="edad" name="edad" min="1" max="120" required>
              </div>
              <div class="col-md-8 mt-3 mt-md-0">
                <label for="actividad" class="form-label fw-bold">Actividad de intere *</label>
                <select class="form-select" id="actividad" name="actividad" required>
                  <option value="" disabled selected>Selecciona una opcio...</option>
                  <option value="teatro">Teatro Inicial</option>
                  <option value="foto">Taller fotografia</option>
                  <option value="adopcion">Adopcion</option>
                  <option value="tiroblanco">Tiro al blanco</option>
                  <option value="historia">Historiapuerto</option>
                  <option value="cine">Documentales</option>
                </select>
              </div>
            </div>

            <!-- Comentarios -->
            <div class="mb-4">
              <label for="comentarios" class="form-label fw-bold">Comentarios adicionales</label>
              <textarea class="form-control" id="comentarios" name="comentarios" rows="3" placeholder="¿Tienes alguna consulta ?"></textarea>
            </div>

            <!-- Checkbox de Condiciones -->
            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" id="condiciones" name="condiciones" required>
              <label class="form-check-label text-muted small" for="condiciones">
                Acepto las condiciones de participacion y el tratamiento de mis datos. *
              </label>
            </div>

            <!-- Boton de Envío -->
            <button type="submit" class="btn btn-cultural w-100 py-2">Inscribirse!</button>
           
          </form>

        </div>
      </div>
    </div>
  </main>

  <footer class="text-center py-4 mt-5">
    <p class="mb-0">&copy; 2026 Centro Cultural Puerto Abierto. Consultar por Jorge en la Chacalia.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
